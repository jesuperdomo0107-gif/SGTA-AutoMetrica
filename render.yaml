services:
  # Backend API (FastAPI + Gunicorn/Uvicorn)
  - type: web
    name: autometrica-backend
    runtime: python
    plan: free
    rootDir: autometrica-full/backend
    buildCommand: "./build.sh"
    startCommand: "python init_prod.py && gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SUPERUSER_EMAIL
        sync: false
      - key: SUPERUSER_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false

  # Frontend SPA (React + Vite)
  - type: web
    name: autometrica-frontend
    runtime: static
    rootDir: autometrica-full/frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: autometrica-db
    plan: free
    databaseName: autometrica_db
    user: autometrica_user
